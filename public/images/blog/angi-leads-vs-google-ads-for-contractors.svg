<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid13" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EAF1FC" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#0F4DA8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#grid13)"/>
  <path d="M1200,0 L1200,260 L940,0 Z" fill="url(#accent13)" opacity="0.08"/>

  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1565D8">LEAD GENERATION</text>
  <rect x="80" y="100" width="48" height="3" fill="#1565D8"/>

  <text x="80" y="260" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0A0A0A">Angi Leads vs</text>
  <text x="80" y="312" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0A0A0A">Google Ads for</text>
  <text x="80" y="364" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0A0A0A">Contractors</text>

  <text x="80" y="590" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">mktforcontractors.com</text>
  <!-- simbolo oficial "camadas sob o telhado" (brand/logo-simbolo.svg), nao redesenhado -->
  <g transform="translate(1030,578) scale(0.18) translate(-36,-52)">
    <g fill="none" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round">
      <path d="M 36 174 L 144 174 L 178 150 L 70 150 Z"/>
      <path d="M 36 148 L 144 148 L 178 124 L 70 124 Z"/>
      <path d="M 36 122 L 144 122 L 178 98 L 70 98 Z"/>
    </g>
    <path d="M 36 92 L 144 92 L 137 52 L 77 52 Z" fill="#1565d8"/>
    <path d="M 144 92 L 178 68 L 137 52 Z" fill="#0f4ca6"/>
  </g>
  <text x="1064" y="595" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">MKT for Contractors</text>

  <rect x="700" y="150" width="420" height="360" rx="24" fill="#F7F9FC" stroke="#D0D5DD" stroke-width="1.5"/>

  <!-- left card: Angi Leads, one request fanning out to several pros -->
  <g transform="translate(724,182)">
    <rect x="0" y="0" width="170" height="290" rx="14" fill="#FFFFFF" stroke="#E2574C" stroke-width="2"/>
    <circle cx="85" cy="48" r="22" fill="#FDEAE8"/>
    <path d="M85 34 C73 34 64 44 64 56 C64 72 85 92 85 92 C85 92 106 72 106 56 C106 44 97 34 85 34 Z" fill="#E2574C"/>
    <text x="85" y="114" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#0A0A0A" text-anchor="middle">Angi Leads</text>
    <line x1="16" y1="128" x2="154" y2="128" stroke="#D0D5DD" stroke-width="1.5"/>
    <text x="16" y="150" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#667085">1 REQUEST SENT TO</text>
    <circle cx="36" cy="172" r="12" fill="#F4F6F8" stroke="#E2574C" stroke-width="1.5"/>
    <circle cx="68" cy="172" r="12" fill="#F4F6F8" stroke="#E2574C" stroke-width="1.5"/>
    <circle cx="100" cy="172" r="12" fill="#F4F6F8" stroke="#E2574C" stroke-width="1.5"/>
    <circle cx="132" cy="172" r="12" fill="#F4F6F8" stroke="#E2574C" stroke-width="1.5"/>
    <text x="16" y="200" font-family="Inter, Arial, sans-serif" font-size="9" fill="#667085">Several pros, same lead,</text>
    <text x="16" y="212" font-family="Inter, Arial, sans-serif" font-size="9" fill="#667085">each one pays the fee</text>
    <rect x="16" y="250" width="138" height="26" rx="13" fill="#E2574C"/>
    <text x="85" y="267" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SHARED LEAD</text>
  </g>

  <!-- right card: Google Ads, exclusive -->
  <g transform="translate(944,182)">
    <rect x="0" y="0" width="170" height="290" rx="14" fill="#FFFFFF" stroke="#1565D8" stroke-width="2"/>
    <rect x="16" y="18" width="24" height="24" rx="6" fill="#1565D8"/>
    <text x="16" y="66" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#0A0A0A">Google Ads</text>
    <line x1="16" y1="80" x2="154" y2="80" stroke="#D0D5DD" stroke-width="1.5"/>
    <text x="16" y="100" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#667085">1 REQUEST SENT TO</text>
    <circle cx="85" cy="130" r="14" fill="#EAF2FE" stroke="#1565D8" stroke-width="2"/>
    <text x="16" y="160" font-family="Inter, Arial, sans-serif" font-size="9" fill="#667085">You choose the keywords</text>
    <text x="16" y="172" font-family="Inter, Arial, sans-serif" font-size="9" fill="#667085">or the lead goal, no sharing</text>
    <rect x="16" y="250" width="138" height="26" rx="13" fill="#1565D8"/>
    <text x="85" y="267" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">EXCLUSIVE LEAD</text>
  </g>

  <!-- VS badge -->
  <circle cx="910" cy="330" r="34" fill="#0A0A0A"/>
  <text x="910" y="339" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">VS</text>
</svg>
