<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid8" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EAF1FC" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#0F4DA8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#grid8)"/>
  <path d="M1200,0 L1200,260 L940,0 Z" fill="url(#accent8)" opacity="0.08"/>

  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1565D8">MARKETING ANALYTICS</text>
  <rect x="80" y="100" width="48" height="3" fill="#1565D8"/>

  <text x="80" y="260" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0A0A0A">How Much Should</text>
  <text x="80" y="312" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0A0A0A">Contractors Spend</text>
  <text x="80" y="364" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0A0A0A">on Marketing?</text>

  <text x="80" y="590" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">mktforcontractors.com</text>
  <!-- simbolo oficial "camadas sob o telhado" (brand/logo-simbolo.svg), nao redesenhado -->
  <g transform="translate(1030,578) scale(0.18) translate(-36,-52)">
    <g fill="none" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round">
      <path d="M 36 174 L 144 174 L 178 150 L 70 150 Z"/>
      <path d="M 36 148 L 144 148 L 178 124 L 70 124 Z"/>
      <path d="M 36 122 L 144 122 L 178 98 L 70 98 Z"/>
    </g>
    <path d="M 36 92 L 144 92 L 137 52 L 77 52 Z" fill="#1565d8"/>
    <path d="M 144 92 L 178 68 L 137 52 Z" fill="#0f4ca6"/>
  </g>
  <text x="1064" y="595" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">MKT for Contractors</text>

  <rect x="700" y="150" width="420" height="360" rx="24" fill="#F7F9FC" stroke="#D0D5DD" stroke-width="1.5"/>

  <!-- budget allocation donut -->
  <g transform="translate(910,330)">
    <circle r="120" fill="none" stroke="#EAF1FC" stroke-width="34"/>
    <circle r="120" fill="none" stroke="#1565D8" stroke-width="34" stroke-dasharray="320 754" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="120" fill="none" stroke="#0F4DA8" stroke-width="34" stroke-dasharray="180 754" stroke-dashoffset="-320" transform="rotate(-90)"/>
    <circle r="120" fill="none" stroke="#2AA198" stroke-width="34" stroke-dasharray="120 754" stroke-dashoffset="-500" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="70" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.5"/>
    <text x="0" y="8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#1565D8" text-anchor="middle">$</text>
  </g>

  <!-- legend chips -->
  <rect x="740" y="470" width="14" height="14" rx="3" fill="#1565D8"/>
  <text x="762" y="482" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0A0A0A">Paid media</text>
  <rect x="900" y="470" width="14" height="14" rx="3" fill="#0F4DA8"/>
  <text x="922" y="482" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0A0A0A">SEO / site</text>
  <rect x="740" y="495" width="14" height="14" rx="3" fill="#2AA198"/>
  <text x="762" y="507" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0A0A0A">CRM / tools</text>

  <!-- budget label chip -->
  <rect x="760" y="200" width="150" height="40" rx="20" fill="#0A0A0A"/>
  <text x="835" y="226" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">CAC × VOLUME</text>
</svg>
