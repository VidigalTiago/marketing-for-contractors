  <circle cx="886" cy="340" r="100" fill="none" stroke="#D0D5DD" stroke-width="1.5"/>
  <circle cx="886" cy="340" r="50" fill="none" stroke="#1565D8" stroke-width="1.5" opacity="0.6"/>

