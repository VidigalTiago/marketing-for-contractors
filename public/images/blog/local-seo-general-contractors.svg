  <circle cx="776" cy="260" r="7" fill="#0A0A0A"/>
  <circle cx="996" cy="260" r="7" fill="#0A0A0A"/>
  <circle cx="1006" cy="400" r="7" fill="#0A0A0A"/>
  <circle cx="766" cy="420" r="7" fill="#0A0A0A"/>

