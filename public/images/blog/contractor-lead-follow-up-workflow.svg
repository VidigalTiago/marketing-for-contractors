<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EAF1FC" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#0F4DA8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#grid1)"/>
  <path d="M1200,0 L1200,260 L940,0 Z" fill="url(#accent1)" opacity="0.08"/>

  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1565D8">CRM AND FOLLOW-UP</text>
  <rect x="80" y="100" width="48" height="3" fill="#1565D8"/>

  <text x="80" y="280" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A0A0A">How to Follow Up With</text>
  <text x="80" y="332" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A0A0A">Contractor Leads and</text>
  <text x="80" y="384" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A0A0A">Win More Projects</text>

  <text x="80" y="590" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">mktforcontractors.com</text>
  <g transform="translate(1030,578)">
    <path d="M0 14 L10 0 L20 14 L20 22 L0 22 Z" fill="#1565D8"/>
    <text x="28" y="17" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">MKT for Contractors</text>
  </g>

  <!-- Icon card -->
  <rect x="700" y="150" width="420" height="360" rx="24" fill="#F7F9FC" stroke="#D0D5DD" stroke-width="1.5"/>

  <!-- workflow chain: call -> sms -> email -> crm -->
  <g stroke="#1565D8" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round">
    <path d="M790 230 L 1030 230" fill="none"/>
  </g>
  <g stroke="#1565D8" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round">
    <path d="M790 230 L790 420" fill="none"/>
  </g>

  <!-- phone bubble -->
  <circle cx="790" cy="230" r="42" fill="#EAF2FE" stroke="#1565D8" stroke-width="2"/>
  <path d="M773 213c-3 3-3 8 0 13c6 10 15 19 25 25c5 3 10 3 13 0l4-4c2-2 2-5 0-7l-8-7c-2-2-5-2-7 0l-2 2c-5-3-10-8-13-13l2-2c2-2 2-5 0-7l-7-8c-2-2-5-2-7 0z" fill="#1565D8" transform="translate(0,0) scale(0.9) translate(9,3)"/>

  <!-- sms bubble -->
  <circle cx="1030" cy="230" r="42" fill="#EAF2FE" stroke="#1565D8" stroke-width="2"/>
  <rect x="1008" y="212" width="44" height="32" rx="8" fill="#1565D8"/>
  <path d="M1018 244 l0 12 l12 -12 z" fill="#1565D8"/>
  <circle cx="1020" cy="228" r="2.6" fill="#EAF2FE"/>
  <circle cx="1030" cy="228" r="2.6" fill="#EAF2FE"/>
  <circle cx="1040" cy="228" r="2.6" fill="#EAF2FE"/>

  <!-- email envelope -->
  <circle cx="790" cy="420" r="42" fill="#EAF2FE" stroke="#1565D8" stroke-width="2"/>
  <rect x="766" y="404" width="48" height="34" rx="4" fill="none" stroke="#1565D8" stroke-width="3.5"/>
  <path d="M766 406 L790 424 L814 406" fill="none" stroke="#1565D8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- arrow down/right to crm -->
  <path d="M830 420 L 1000 420" stroke="#1565D8" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
  <path d="M1000 420 L 1000 340" stroke="#1565D8" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>

  <!-- crm record card -->
  <g transform="translate(950,255)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="#0F4DA8"/>
    <circle cx="24" cy="26" r="10" fill="#FFFFFF"/>
    <rect x="42" y="20" width="82" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="42" y="32" width="60" height="5" rx="2.5" fill="#8FB7EE"/>
    <rect x="16" y="54" width="108" height="6" rx="3" fill="#8FB7EE"/>
    <rect x="16" y="68" width="80" height="6" rx="3" fill="#8FB7EE"/>
    <rect x="16" y="82" width="60" height="10" rx="5" fill="#2AA198"/>
  </g>

  <!-- arrowhead marker to CRM -->
  <path d="M994 344 L1000 336 L1006 344" fill="none" stroke="#1565D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- clock accent (timing) -->
  <g transform="translate(870,455)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <path d="M0 -14 L0 0 L10 6" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
