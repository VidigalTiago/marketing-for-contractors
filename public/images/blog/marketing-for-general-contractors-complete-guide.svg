<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#123A75" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#2AA198"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0A1A33"/>
  <rect width="1200" height="630" fill="url(#grid6)" opacity="0.5"/>
  <path d="M1200,0 L1200,300 L900,0 Z" fill="url(#accent6)" opacity="0.18"/>

  <!-- FEATURED GUIDE ribbon -->
  <rect x="80" y="70" width="168" height="30" rx="15" fill="#1565D8"/>
  <text x="164" y="90" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">FEATURED GUIDE</text>

  <text x="80" y="150" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#8FB7EE">CONTRACTOR GROWTH</text>
  <rect x="80" y="164" width="48" height="3" fill="#8FB7EE"/>

  <text x="80" y="230" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">Marketing for General</text>
  <text x="80" y="282" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">Contractors:</text>
  <text x="80" y="334" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">The Complete Guide</text>

  <text x="80" y="590" font-family="Inter, Arial, sans-serif" font-size="15" fill="#A9BEDD">mktforcontractors.com</text>
  <g transform="translate(1030,578)">
    <path d="M0 14 L10 0 L20 14 L20 22 L0 22 Z" fill="#FFFFFF"/>
    <text x="28" y="17" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">MKT for Contractors</text>
  </g>

  <!-- hub composition: central house blueprint orbited by channel icons -->
  <g transform="translate(920,340)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#22467C" stroke-width="1.5" stroke-dasharray="4 8"/>

    <!-- connecting lines -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#3E6BB0" stroke-width="2"/>
    <line x1="0" y1="0" x2="130" y2="-75" stroke="#3E6BB0" stroke-width="2"/>
    <line x1="0" y1="0" x2="130" y2="75" stroke="#3E6BB0" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#3E6BB0" stroke-width="2"/>
    <line x1="0" y1="0" x2="-130" y2="75" stroke="#3E6BB0" stroke-width="2"/>
    <line x1="0" y1="0" x2="-130" y2="-75" stroke="#3E6BB0" stroke-width="2"/>

    <!-- center: house/blueprint -->
    <g transform="translate(-38,-30)">
      <path d="M0 44 L0 16 L38 -10 L76 16 L76 44 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
      <rect x="0" y="44" width="76" height="40" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="32" y="58" width="14" height="26" fill="#1565D8"/>
    </g>

    <!-- orbit: search (google ads) -->
    <g transform="translate(0,-150)">
      <circle r="32" fill="#132E5A" stroke="#1565D8" stroke-width="2.5"/>
      <circle cx="-4" cy="-4" r="10" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <line x1="4" y1="4" x2="11" y2="11" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- orbit: chart (analytics) -->
    <g transform="translate(130,-75)">
      <circle r="32" fill="#132E5A" stroke="#2AA198" stroke-width="2.5"/>
      <rect x="-12" y="-2" width="7" height="16" fill="#FFFFFF"/>
      <rect x="-1" y="-10" width="7" height="24" fill="#FFFFFF"/>
      <rect x="10" y="-16" width="7" height="30" fill="#2AA198"/>
    </g>

    <!-- orbit: chat/leads -->
    <g transform="translate(130,75)">
      <circle r="32" fill="#132E5A" stroke="#1565D8" stroke-width="2.5"/>
      <rect x="-16" y="-12" width="32" height="22" rx="6" fill="#FFFFFF"/>
      <path d="M-6 10 l0 8 l8 -8 z" fill="#FFFFFF"/>
    </g>

    <!-- orbit: crm record -->
    <g transform="translate(0,150)">
      <circle r="32" fill="#132E5A" stroke="#1565D8" stroke-width="2.5"/>
      <circle cx="0" cy="-8" r="7" fill="#FFFFFF"/>
      <path d="M-13 14 c0 -10 26 -10 26 0" fill="#FFFFFF"/>
    </g>

    <!-- orbit: dollar/revenue -->
    <g transform="translate(-130,75)">
      <circle r="32" fill="#132E5A" stroke="#2AA198" stroke-width="2.5"/>
      <text x="0" y="9" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">$</text>
    </g>

    <!-- orbit: local seo pin -->
    <g transform="translate(-130,-75)">
      <circle r="32" fill="#132E5A" stroke="#1565D8" stroke-width="2.5"/>
      <path d="M0 -14 C10 -14 16 -6 16 2 C16 14 0 24 0 24 C0 24 -16 14 -16 2 C-16 -6 -10 -14 0 -14 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="5" fill="#132E5A"/>
    </g>
  </g>
</svg>
