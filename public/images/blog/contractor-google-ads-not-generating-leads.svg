    </g>

    <line x1="24" y1="228" x2="336" y2="228" stroke="#D0D5DD" stroke-width="1" stroke-dasharray="3 3"/>

    <rect x="24" y="242" width="312" height="26" rx="13" fill="#1565D8"/>
    <text x="180" y="259" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CHECK IN ORDER, NOT AT RANDOM</text>
