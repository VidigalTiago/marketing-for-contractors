<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="gridDiag" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EAF1FC" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#0F4DA8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#gridDiag)"/>
  <path d="M1200,0 L1200,260 L940,0 Z" fill="url(#accentDiag)" opacity="0.08"/>

  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1565D8">GOOGLE ADS</text>
  <rect x="80" y="100" width="48" height="3" fill="#1565D8"/>

  <text x="80" y="226" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A">Why Your Ads</text>
  <text x="80" y="268" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A">Are Not</text>
  <text x="80" y="310" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A">Generating</text>
  <text x="80" y="352" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A">Leads</text>

  <text x="80" y="590" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">mktforcontractors.com</text>
  <!-- simbolo oficial "camadas sob o telhado" (brand/logo-simbolo.svg), nao redesenhado -->
  <g transform="translate(1030,578) scale(0.18) translate(-36,-52)">
    <g fill="none" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round">
      <path d="M 36 174 L 144 174 L 178 150 L 70 150 Z"/>
      <path d="M 36 148 L 144 148 L 178 124 L 70 124 Z"/>
      <path d="M 36 122 L 144 122 L 178 98 L 70 98 Z"/>
    </g>
    <path d="M 36 92 L 144 92 L 137 52 L 77 52 Z" fill="#1565d8"/>
    <path d="M 144 92 L 178 68 L 137 52 Z" fill="#0f4ca6"/>
  </g>
  <text x="1064" y="595" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">MKT for Contractors</text>

  <rect x="700" y="150" width="420" height="360" rx="24" fill="#F7F9FC" stroke="#D0D5DD" stroke-width="1.5"/>

  <!-- diagnostic checklist card -->
  <g transform="translate(730,182)">
    <rect x="0" y="0" width="360" height="290" rx="14" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
    <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#0A0A0A">Diagnostic Order</text>
    <line x1="24" y1="52" x2="336" y2="52" stroke="#D0D5DD" stroke-width="1.5"/>

    <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#0A0A0A">
      <circle cx="34" cy="76" r="10" fill="#1565D8"/>
      <text x="34" y="80" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-size="11">1</text>
      <text x="54" y="80">Ad status: Eligible?</text>

      <circle cx="34" cy="108" r="10" fill="#1565D8"/>
      <text x="34" y="112" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-size="11">2</text>
      <text x="54" y="112">Search Lost IS: budget or rank?</text>

      <circle cx="34" cy="140" r="10" fill="#1565D8"/>
      <text x="34" y="144" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-size="11">3</text>
      <text x="54" y="144">Search terms: negatives added?</text>

      <circle cx="34" cy="172" r="10" fill="#0F4DA8"/>
