<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid7" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EAF1FC" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#0F4DA8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#grid7)"/>
  <path d="M1200,0 L1200,260 L940,0 Z" fill="url(#accent7)" opacity="0.08"/>

  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1565D8">MARKETING ANALYTICS</text>
  <rect x="80" y="100" width="48" height="3" fill="#1565D8"/>

  <text x="80" y="280" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A0A0A">How to Calculate</text>
  <text x="80" y="332" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A0A0A">Contractor Marketing ROI</text>

  <text x="80" y="590" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">mktforcontractors.com</text>
  <g transform="translate(1030,578)">
    <path d="M0 14 L10 0 L20 14 L20 22 L0 22 Z" fill="#1565D8"/>
    <text x="28" y="17" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">MKT for Contractors</text>
  </g>

  <rect x="700" y="150" width="420" height="360" rx="24" fill="#F7F9FC" stroke="#D0D5DD" stroke-width="1.5"/>

  <!-- dashboard: rising bar chart -->
  <g transform="translate(750,460)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#D0D5DD" stroke-width="2"/>
    <rect x="20" y="-40" width="40" height="40" rx="4" fill="#8FB7EE"/>
    <rect x="90" y="-80" width="40" height="80" rx="4" fill="#1565D8"/>
    <rect x="160" y="-130" width="40" height="130" rx="4" fill="#0F4DA8"/>
    <rect x="230" y="-190" width="40" height="190" rx="4" fill="#2AA198"/>
  </g>

  <!-- ROI return-loop arrow around the tallest bar -->
  <g transform="translate(970,340)">
    <path d="M-70 40 A 74 74 0 1 1 0 114" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>
    <path d="M-14 106 L0 114 L-4 98" fill="#0A0A0A"/>
  </g>

  <!-- dollar badge floating -->
  <g transform="translate(970,300)">
    <circle cx="0" cy="0" r="46" fill="#FFFFFF" stroke="#1565D8" stroke-width="4"/>
    <text x="0" y="14" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#1565D8" text-anchor="middle">$</text>
  </g>

  <!-- ROI label chip -->
  <rect x="760" y="200" width="140" height="40" rx="20" fill="#2AA198"/>
  <text x="830" y="226" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">ROI +312%</text>
</svg>
