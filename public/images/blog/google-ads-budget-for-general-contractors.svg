<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="gridBudget" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EAF1FC" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentBudget" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#0F4DA8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#gridBudget)"/>
  <path d="M1200,0 L1200,260 L940,0 Z" fill="url(#accentBudget)" opacity="0.08"/>

  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1565D8">GOOGLE ADS</text>
  <rect x="80" y="100" width="48" height="3" fill="#1565D8"/>

  <text x="80" y="248" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0A0A0A">How Much Should</text>
  <text x="80" y="296" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0A0A0A">You Spend on</text>
  <text x="80" y="344" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0A0A0A">Google Ads?</text>

  <text x="80" y="590" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">mktforcontractors.com</text>
  <!-- simbolo oficial "camadas sob o telhado" (brand/logo-simbolo.svg), nao redesenhado -->
  <g transform="translate(1030,578) scale(0.18) translate(-36,-52)">
    <g fill="none" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round">
      <path d="M 36 174 L 144 174 L 178 150 L 70 150 Z"/>
      <path d="M 36 148 L 144 148 L 178 124 L 70 124 Z"/>
      <path d="M 36 122 L 144 122 L 178 98 L 70 98 Z"/>
    </g>
    <path d="M 36 92 L 144 92 L 137 52 L 77 52 Z" fill="#1565d8"/>
    <path d="M 144 92 L 178 68 L 137 52 Z" fill="#0f4ca6"/>
  </g>
  <text x="1064" y="595" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">MKT for Contractors</text>

  <rect x="700" y="150" width="420" height="360" rx="24" fill="#F7F9FC" stroke="#D0D5DD" stroke-width="1.5"/>

  <!-- budget math card -->
  <g transform="translate(730,182)">
    <rect x="0" y="0" width="360" height="290" rx="14" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
    <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#0A0A0A">Daily Budget Math</text>
    <line x1="24" y1="52" x2="336" y2="52" stroke="#D0D5DD" stroke-width="1.5"/>

    <text x="24" y="78" font-family="Inter, Arial, sans-serif" font-size="11" fill="#667085">Average daily budget</text>
    <rect x="24" y="84" width="120" height="16" rx="4" fill="#E8F2FF"/>
    <text x="150" y="96" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0A0A0A">$50</text>

    <text x="24" y="124" font-family="Inter, Arial, sans-serif" font-size="11" fill="#667085">Max daily spend (2x)</text>
    <rect x="24" y="130" width="240" height="16" rx="4" fill="#1565D8"/>
    <text x="272" y="142" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0A0A0A">$100</text>

    <text x="24" y="170" font-family="Inter, Arial, sans-serif" font-size="11" fill="#667085">Monthly cap (30.4x)</text>
    <rect x="24" y="176" width="312" height="16" rx="4" fill="#0F4DA8"/>
    <text x="24" y="206" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" transform="translate(0,-16)"> </text>
    <text x="252" y="188" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">$1,520 / mo</text>

    <line x1="24" y1="222" x2="336" y2="222" stroke="#D0D5DD" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="24" y="246" font-family="Inter, Arial, sans-serif" font-size="11" fill="#667085">Search Lost IS (budget)</text>
    <text x="312" y="246" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1565D8" text-anchor="end">18%</text>

    <rect x="24" y="258" width="312" height="26" rx="13" fill="#1565D8"/>
    <text x="180" y="275" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUDGET OR BID? CHECK BOTH</text>
